# Both existing AIDE modes are enabled for this task; pick one with --mode.
# Nothing here reimplements a mode: values are forwarded to the existing runner
# (sge/submit.sh -> scripts/run_aide.sh) as environment variables.
default_mode: agent
common:
  code_model: gpt-4o-2024-08-06
  feedback_model: gpt-4o-2024-08-06
  # Inner agent must never see any test-set signal.
  feedback: "0"
  test_feedback: "0"
  test_expose: none
modes:
  rule:
    # H0 rule policy = the stock values used by the previous experiments.
    initial_rule_config:
      max_stagnation: 15
      debug_prob: 1.0
      max_debug_depth: 20
      num_drafts: 5
  agent:
    tree_topk: 5
    tree_recent: 5
