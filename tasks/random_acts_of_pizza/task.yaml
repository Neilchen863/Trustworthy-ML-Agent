# Training task: the official grade of runs on this task MAY be shown to the
# meta-improver (RSI training signal).  Held-out evaluation uses a different task.
name: random_acts_of_pizza
competition_id: random-acts-of-pizza
role: train
metric:
  name: roc_auc
  direction: maximize
budget:
  run_secs: 14400        # 4h wall clock per run
  steps: 500
  exec_timeout: 1200     # 20 min per candidate execution
  cpus: 8
  gpus: 0
paths:
  instruction: instruction.md
  env: env/
  data: data/
# Pinned first draft (AIDE's existing seed-node mechanism): every run starts from this neutral,
# leak-free baseline, which removes the "first-draft framework lottery" (the model family of the first
# draft decides the search volume and the outcome).  null = organic draft.  Paths are relative to this
# directory; the runner stages the files on CRC under a content-addressed name.
pinned_first_draft:
  code: seeds/first_draft.py
  plan: seeds/first_draft.plan.txt
# Replicates run per (mode, harness version) in every round.  AIDE/LLM calls are not bit-for-bit
# deterministic, so replicates are what separates a harness effect from search noise.
replicates: [1, 2, 3]
