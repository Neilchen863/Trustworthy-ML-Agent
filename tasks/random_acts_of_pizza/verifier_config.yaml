# Verifiers enabled for this task (global bank: rsi_mvp/verifiers).
enabled:
  - validation_argmax_anchoring
  - submission_sanity
  - validation_mirage
  - extraction_distortion
  - simplified_error_attribution
  - fallback_to_runnable
# Severity -> reward.  Raw per-verifier rewards are kept as a vector (spec 8).
reward_map:
  fail: -1.0
  warn: -0.5
  clean: 0.0
# Findings below this severity are ignored by the adapter.
min_severity: warn
# Per-verifier overrides.  S6_nn_abandoned is an info-level candidate detector in
# the scanner, so this verifier must look at info findings and uses a milder reward.
overrides:
  fallback_to_runnable:
    min_severity: info
    reward_map:
      info: -0.25
