# HELD-OUT task: its official grade must never reach the meta-improver.
# The RSI loop refuses to submit or collect it before a harness is frozen.
name: insults_heldout
competition_id: detecting-insults-in-social-commentary
role: test
metric:
  name: roc_auc
  direction: maximize
budget:
  run_secs: 14400        # 4h wall clock per run
  steps: 500
  exec_timeout: 1200     # 20 min per candidate execution
  cpus: 8
  gpus: 0
paths:
  instruction: instruction.md
  env: env/
  data: data/
# Optional pinned first draft (uses AIDE's existing seed-node mechanism) to reduce
# the "first-draft framework lottery" between matched runs.  null = organic draft.
pinned_first_draft: null
# replicate ids for matched-seed comparisons.  AIDE/LLM calls are not bit-for-bit
# deterministic; a replicate id only labels a run so H0/H1/H2 can be paired.
replicates: [1]
